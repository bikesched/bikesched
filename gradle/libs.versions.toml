[versions]
# Project
bikesched = "0.1.0-SNAPSHOT"
java = "26"

# Gradle plugins
foojay-resolver = "1.0.0"
spotless = "8.10.3"
kotlin = "2.4.20"
dokka = "2.2.0"

# Code formatting
google-java-format = "1.36.1"
ktfmt = "0.64"

# Libraries
postgresql = "42.7.13"
slf4j = "2.0.20"
logback = "1.6.5"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
nanojson = "1.10"
hikaricp = "7.1.0"
awaitility = "4.3.0"
archunit = "1.5.1"

# bikesched-jackson (jackson-module-kotlin: bikesched-kotlin tests only)
jackson = "3.2.3"

[libraries]
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
nanojson = { module = "com.grack:nanojson", version.ref = "nanojson" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "logback-classic", "testcontainers-junit-jupiter", "testcontainers-postgresql", "nanojson", "hikaricp", "awaitility"]

[plugins]
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
