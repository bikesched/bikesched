[versions]
# Project
bikesched = "0.1.0-SNAPSHOT"
java = "26"

# Gradle plugins
foojay-resolver = "1.0.0"
spotless = "8.10.4"
kotlin = "2.4.21"
dokka = "2.2.0"
hugo-plugin = "0.13.0"

# Code formatting
google-java-format = "1.36.1"
ktfmt = "0.64"

# Libraries
postgresql = "42.7.14"
slf4j = "2.0.20"
logback = "1.6.5"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
nanojson = "1.10"
hikaricp = "7.1.0"
awaitility = "4.3.0"
micrometer = "1.17.1"
# Spring Framework version managed by the Spring Boot version above; keep in sync when bumping it
# (only needed for the optional spring-tx dependency).
spring-framework = "7.0.9"
spring-boot = "4.1.1"
archunit = "1.5.1"
cron-utils = "9.2.1"

# bikesched-jackson (jackson-module-kotlin: bikesched-kotlin tests only)
jackson = "3.2.3"

# bikesched-examples:kotlin
ktor = "3.6.0"
exposed = "1.5.1"
kotlinx-serialization = "1.11.0"
moneta = "1.4.5"
# bikesched-examples:java (rate-limit example)
bucket4j = "8.21.0"

[libraries]
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
nanojson = { module = "com.grack:nanojson", version.ref = "nanojson" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-tx = { module = "org.springframework:spring-tx", version.ref = "spring-framework" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring-framework" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cron-utils" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-postgresql = { module = "com.bucket4j:bucket4j_jdk17-postgresql", version.ref = "bucket4j" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
moneta = { module = "org.javamoney:moneta", version.ref = "moneta" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "logback-classic", "testcontainers-junit-jupiter", "testcontainers-postgresql", "nanojson", "hikaricp", "awaitility"]

[plugins]
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
hugo = { id = "io.github.fstaudt.hugo", version.ref = "hugo-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
