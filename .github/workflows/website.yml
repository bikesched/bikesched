# Builds the project website (bikesched-website, see docs/specs/website-project-site.md) and
# deploys it to the Cloudflare Worker green-paper-4e4f (ADR 0047) whenever docs/, the main
# README.md or the bikesched-website module itself change on main. Pull requests are not deployed,
# only pushes to main.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'bikesched-website/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # the Hextra theme (bikesched-website/site/themes/hextra)

      # Same version as `java` in gradle/libs.versions.toml; Gradle runs on it and uses it as the
      # toolchain (no auto-provisioning needed).
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build website
        run: ./gradlew :bikesched-website:hugoBuild

      # Deploys build/hugo/publish/ as the Worker's static assets, configured in
      # bikesched-website/wrangler.jsonc. Cloudflare purges its cache for the new version itself.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_KEY }}
          workingDirectory: bikesched-website
          command: deploy
