# Checks that pull request titles are Conventional Commits (AGENTS.md, section Commits): squash
# merges use the title as the commit message, and the release changelog is generated from the
# commit messages (RELEASING.md). Runs on pull_request_target so it also works for pull requests
# from forks; it checks out no code, it only reads the title.

name: Pull request title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            style
            docs
            test
            build
            ci
            chore
