# Builds and tests every pull request and every push to main: compiles all modules, runs Spotless,
# Javadoc and all tests. The tests start PostgreSQL with Testcontainers, which uses the Docker
# daemon of the ubuntu-latest runner. After a successful build of main, the library modules are
# published to GitHub Packages (the snapshot version from gradle/libs.versions.toml).
#
# Changes to Markdown files and SVG images only (docs, README, logo) skip the build: the build reads
# none of them. The workflow still runs and the `changes` job decides, so a skipped `build` job
# reports success and can be a required status check (with `paths-ignore` the check would never
# report and such pull requests would wait forever).

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything besides *.md and *.svg changed (pull requests: against the base branch, pushes:
  # against the commit before the push).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.svg'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same version as `java` in gradle/libs.versions.toml; Gradle runs on it and uses it as the
      # toolchain (no auto-provisioning needed).
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      # Writes the Gradle cache only on main; pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Docker for Testcontainers
        run: docker version

      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # Only for pushes to main, after a successful build (skipped with it); pull requests never
  # publish.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # publishing to GitHub Packages

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Only snapshots: a release version would be overwritten on every push.
      - name: Publish snapshot to GitHub Packages
        run: |
          version=$(./gradlew properties -q --property version | sed -n 's/^version: //p')
          case "$version" in
            *-SNAPSHOT) ./gradlew publishAllPublicationsToGitHubPackagesRepository ;;
            *) echo "Version $version is not a snapshot, not publishing" ;;
          esac
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
