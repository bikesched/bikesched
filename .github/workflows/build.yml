# Builds and tests every push to main: compiles all modules, runs Spotless, Javadoc and all tests.
# The tests start PostgreSQL with Testcontainers, which uses the Docker daemon of the
# ubuntu-latest runner. After a successful build, the library modules are published to GitHub
# Packages (the snapshot version from gradle/libs.versions.toml).

name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # publishing to GitHub Packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same version as `java` in gradle/libs.versions.toml; Gradle runs on it and uses it as the
      # toolchain (no auto-provisioning needed).
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Docker for Testcontainers
        run: docker version

      - name: Build
        run: ./gradlew build

      # Only snapshots: a release version would be overwritten on every push.
      - name: Publish snapshot to GitHub Packages
        run: |
          version=$(./gradlew properties -q --property version | sed -n 's/^version: //p')
          case "$version" in
            *-SNAPSHOT) ./gradlew publishAllPublicationsToGitHubPackagesRepository ;;
            *) echo "Version $version is not a snapshot, not publishing" ;;
          esac
        env:
          ORG_GRADLE_PROJECT_gitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
