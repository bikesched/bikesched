name: bikesched

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bikesched
      POSTGRES_USER: bikesched
      POSTGRES_PASSWORD: bikesched
    ports:
      # Override the host port if 5432 is taken: POSTGRES_PORT=5433 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikesched -d bikesched"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
