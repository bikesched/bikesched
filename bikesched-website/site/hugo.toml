baseURL = "https://bikesched.org/"
locale = "en-us"
title = "bikesched"
theme = "hextra"

# Allows the raw HTML some of docs/*.md and README.md use (e.g. README.md's
# centered logo image); safe since we control all mounted content. Hextra
# sets this itself too, but it's harmless and explicit to repeat it.
[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 10

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/sbuettner/bikesched"
  weight = 20
  [menu.main.params]
    icon = "github"

# README.md's own logo (docs/logo.svg), mounted as a static asset below.
[params.navbar.logo]
  path = "images/bikesched-logo.svg"
  width = "24"
  height = "24"

# Shown below the page tree in the docs section's left sidebar, as a way back
# to the overview page (the tree itself only lists the section's children).
[[menu.sidebar]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1

# Mount the project's README and docs/ directly, instead of copying them into
# this module, so the website always reflects the single source of truth.
# See docs/specs/website-project-site.md.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../../README.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "../../docs"
    target = "content/docs"
    # docs/specs is internal (not linked from docs/index.md, see AGENTS.md);
    # the index files (docs/index.md and each section's README.md) and the ADR
    # template are mounted individually below under their Hugo-recognized
    # names instead.
    files = ["! specs/**", "! index.md", "! */README.md", "! decisions/template.md"]
  [[module.mounts]]
    source = "../../docs/index.md"
    target = "content/docs/_index.md"
  [[module.mounts]]
    source = "../../docs/getting-started/README.md"
    target = "content/docs/getting-started/_index.md"
  [[module.mounts]]
    source = "../../docs/jobs/README.md"
    target = "content/docs/jobs/_index.md"
  [[module.mounts]]
    source = "../../docs/multi-step-jobs/README.md"
    target = "content/docs/multi-step-jobs/_index.md"
  [[module.mounts]]
    source = "../../docs/integrations/README.md"
    target = "content/docs/integrations/_index.md"
  [[module.mounts]]
    source = "../../docs/operations/README.md"
    target = "content/docs/operations/_index.md"
  [[module.mounts]]
    source = "../../docs/decisions/README.md"
    target = "content/docs/decisions/_index.md"
  [[module.mounts]]
    source = "../../docs/logo.svg"
    target = "static/images/bikesched-logo.svg"
  [[module.mounts]]
    source = "static"
    target = "static"
