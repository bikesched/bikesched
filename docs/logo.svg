<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">bikesched icon</title>
<desc id="desc">Blue bicycle shaped like a B, with a subtle clock hand and motion streaks.</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- motion -->
<path d="M255 235H440 M180 315H370 M250 395H300" stroke="#91A8FF" stroke-width="54"/>
<!-- perfectly circular wheels -->
<circle cx="420" cy="615" r="150" stroke="#2450FF" stroke-width="58"/>
<circle cx="890" cy="615" r="150" stroke="#2450FF" stroke-width="58"/>
<!-- bicycle / B silhouette -->
<path d="M485 175H805 C880 175 927 220 927 285 C927 354 876 395 805 395 H585" stroke="#2450FF" stroke-width="58"/>
<path d="M510 300H665 M575 300L420 615 M550 395H810 L890 465  395L485 515 M570 615H740 M810  615" stroke="#2450FF" stroke-width="58"/>
<!-- understated clock hand -->
<path d="M890 615L941 558" stroke="#91A8FF" stroke-width="22"/>
</g>
<circle cx="420" cy="615" r="30" fill="#2450FF"/>
<circle cx="890" cy="615" r="30" fill="#2450FF"/>
</svg>
